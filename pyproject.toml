[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilora-experiment"
version = "0.1.0"
description = "Engineering-oriented MobiLoRA reproduction prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.115.0",
    "huggingface_hub>=0.26.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
